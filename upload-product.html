<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carica annuncio - MarketHub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <div class="logo">🛒 MarketHub</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="upload-product.html">Carica annuncio</a>
            <a href="my-products.html">Miei annunci</a>
            <a href="#" onclick="logout()">Esci</a>
        </div>
    </div>
</nav>

<div class="upload-container">
    <h1>Carica annuncio</h1>
    <p>Prodotti o servizi – verranno pubblicati manualmente sul canale Telegram</p>
    
    <div id="subscriptionWarning" class="alert error" style="display:none;">
        ⚠️ Abbonamento non attivo. <a href="dashboard.html">Attivalo ora</a>
    </div>
    
    <form id="uploadProductForm" class="upload-form" style="display:none;">
        <div class="form-group">
            <label>Foto *</label>
            <input type="file" id="productImageFile" accept="image/*" required>
            <div id="imagePreview" class="image-preview"></div>
        </div>
        
        <div class="form-group">
            <label>Titolo *</label>
            <input type="text" id="productName" required>
        </div>
        
        <div class="form-group">
            <label>Descrizione *</label>
            <textarea id="productDescription" rows="4" required></textarea>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>Prezzo (€) *</label>
                <input type="number" id="productPrice" step="0.01" required>
            </div>
            <div class="form-group">
                <label>Categoria *</label>
                <select id="productCategory" required>
                    <option>Elettronica</option>
                    <option>Abbigliamento</option>
                    <option>Casa</option>
                    <option>Sport</option>
                    <option>Collezionismo</option>
                    <option>Servizi</option>
                    <option>Altro</option>
                </select>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>Quantità</label>
                <input type="number" id="productQuantity" value="1">
            </div>
            <div class="form-group">
                <label>Condizione</label>
                <select id="productCondition">
                    <option>Nuovo</option>
                    <option>Come nuovo</option>
                    <option>Ottimo</option>
                    <option>Buono</option>
                </select>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>Spedizione da</label>
                <select id="productShippingFrom">
                    <option value="IT">Italia</option>
                    <option value="EU">Europa</option>
                    <option value="Worldwide">Mondo</option>
                </select>
            </div>
            <div class="form-group">
                <label>Costo spedizione (€)</label>
                <input type="number" id="productShippingCost" value="0" step="0.01">
            </div>
        </div>
        
        <div class="form-group">
            <label>I tuoi contatti</label>
            <div style="background:rgba(255,255,255,0.05); padding:1rem; border-radius:12px;">
                <p>📧 <strong id="displayEmail"></strong></p>
                <p>📱 <strong id="displayTelegram"></strong></p>
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary">📤 Invia annuncio</button>
    </form>
    
    <div id="uploadMessage" class="alert"></div>
</div>

<script src="script.js"></script>
</body>
</html>
