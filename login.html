<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi - MarketHub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <div class="logo">🛒 MarketHub</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#features">Vantaggi</a>
            <a href="index.html#pricing">Prezzi</a>
            <a href="index.html#register">Registrati</a>
            <a href="login.html">Accedi</a>
        </div>
    </div>
</nav>

<div class="register">
    <div class="container">
        <h2>Accedi al tuo account</h2>
        <p>Inserisci le tue credenziali per visualizzare lo stato del tuo abbonamento</p>
        <form id="loginForm" class="register-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" required placeholder="tuo@email.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary">Accedi</button>
        </form>
        <div id="loginMessage" class="alert"></div>
        <p style="text-align: center; margin-top: 1rem;">Non hai un account? <a href="index.html#register">Registrati</a></p>
    </div>
</div>

<footer>
    <div class="container">
        <p>&copy; 2025 MarketHub - Il marketplace globale su Telegram</p>
        <p><a href="privacy.html">Privacy</a> | <a href="terms.html">Termini</a> | <a href="cookies.html">Cookie Policy</a> | <a href="https://web.telegram.org/a/#8640586976" target="_blank">Bot Telegram</a></p>
    </div>
</footer>

<script src="script.js"></script>
</body>
</html>
